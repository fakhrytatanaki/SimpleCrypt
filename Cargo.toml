[package]
name = "simplecrypt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Small vault. Quiet secrets. A local-first encrypted terminal vault."
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6"
fs2 = "0.4"
getrandom = "0.2"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tempfile = "3"
thiserror = "2"
unicode-width = "0.2"
zeroize = { version = "1.8", features = ["derive", "serde"] }

[profile.release]
lto = "thin"
strip = true
